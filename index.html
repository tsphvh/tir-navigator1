<!doctype html><html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10283c"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="TIR Navigator"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><title>TIR Navigator</title><style>html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;background:#10283c}#map{position:absolute;inset:0}.panel{position:absolute;z-index:1000;top:env(safe-area-inset-top);left:10px;right:10px;max-width:460px;margin:auto;background:#fff;border-radius:18px;padding:14px;box-shadow:0 5px 24px #0004;max-height:70vh;overflow:auto}h1{font-size:20px;margin:0 0 8px}label{font-size:12px;font-weight:700;color:#334}input,button{box-sizing:border-box;width:100%;padding:11px;margin:4px 0 9px;border-radius:10px;border:1px solid #ccd4dc;font-size:16px}button{background:#1268ab;color:#fff;font-weight:700;border:0}button.secondary{background:#e8f0f7;color:#17466d}.row{display:flex;gap:7px}.row>*{flex:1;min-width:0}.small{font-size:12px;color:#52606d}#status{font-size:13px;line-height:1.35;white-space:pre-wrap}details{margin:5px 0}.foot{position:absolute;bottom:env(safe-area-inset-bottom);right:10px;z-index:999;background:#fff9;border-radius:8px;padding:5px;font-size:10px}</style></head><body><div id="map"></div><section class="panel"><h1>🚛 TIR Navigator</h1><div class="small">Ciągnik + naczepa • 40 t • Europa</div><label for="key">Klucz HERE API (wymagany do tras ciężarowych)</label><input id="key" type="password" placeholder="Wklej klucz HERE API" autocomplete="off"><div class="row"><button id="gps">📍 Moja lokalizacja</button><button id="search" class="secondary">🔎 Szukaj celu</button></div><label for="destination">Cel: adres, firma lub współrzędne lat,lon</label><input id="destination" placeholder="np. Berlin, Niemcy"><details><summary>Parametry ciężarówki</summary><div class="row"><div><label>Wysokość (m)</label><input id="height" type="number" step="0.01" value="4"></div><div><label>Szerokość (m)</label><input id="width" type="number" step="0.01" value="2.55"></div></div><div class="row"><div><label>Długość (m)</label><input id="length" type="number" step="0.1" value="16.5"></div><div><label>Masa (t)</label><input id="weight" type="number" step="0.1" value="40"></div></div></details><button id="route">Wyznacz trasę TIR</button><div id="status" role="status">Najpierw wybierz lokalizację i cel. Mapa wymaga internetu.</div><div class="small">Prototyp demonstracyjny. Zawsze weryfikuj znaki, ograniczenia i lokalne zakazy.</div></section><div class="foot">© OpenStreetMap contributors</div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="app.js"></script></body></html>
